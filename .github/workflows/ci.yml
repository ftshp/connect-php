name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer validate --strict
      - run: composer normalize --dry-run
      - run: vendor/bin/composer-dependency-analyser
      - run: vendor/bin/php-cs-fixer check --diff
      - run: vendor/bin/phpstan

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [lowest, highest]
        protobuf: [ext, pure]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ${{ matrix.protobuf == 'ext' && 'bcmath, protobuf' || 'bcmath' }}
          coverage: none
      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: vendor/bin/phpunit

  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.75.0
      - name: Install protoc
        run: |
          curl -sSfL -o protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip
          sudo unzip -q -o protoc.zip -d /usr/local bin/protoc 'include/*'
          rm protoc.zip
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: make generate
      - run: git diff --exit-code tests/Generated
      - run: test -z "$(git status --porcelain tests/Generated)"

  conformance:
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: protobuf, pcntl, posix, bcmath, zlib
          coverage: none
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.75.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            build/bin
          key: conformance-${{ runner.os }}-v1.0.7
      - uses: ramsey/composer-install@v4
      - run: make conformance-install
      - run: make conformance-server
      - run: make conformance-client

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath
          coverage: pcov
      - uses: ramsey/composer-install@v4
      - run: vendor/bin/infection --threads=max --git-diff-lines --git-diff-base=origin/main --min-msi=70 --min-covered-msi=80 --logger-github
